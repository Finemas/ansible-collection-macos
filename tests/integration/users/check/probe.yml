---
- name: Probe users drift in check mode
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Record existing human accounts
      ansible.builtin.shell: |
        set -o pipefail
        dscl . -list /Users UniqueID | awk '$2 >= 500 && $1 !~ /^_/ {print $1}'
      args:
        executable: /bin/bash
      register: users_recorded
      changed_when: false
      check_mode: false

    - name: Apply role
      ansible.builtin.include_role:
        name: finemas.macos.users
      vars:
        users_accounts:
          - name: drifter
            admin: false
            hidden: false
        users_absent: [leaver]
        users_ignore: "{{ users_recorded.stdout_lines }}"
