---
- name: Converge users absent
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Record existing human accounts
      ansible.builtin.shell: |
        set -o pipefail
        dscl . -list /Users UniqueID | awk '$2 >= 500 && $1 !~ /^_/ {print $1}'
      args:
        executable: /bin/bash
      register: users_recorded
      changed_when: false

    # The kept home marks a finished run, so the second converge does not recreate bob.
    - name: Look up bob home
      ansible.builtin.stat:
        path: /Users/bob
      register: users_bob_home

    - name: Create fixture account bob
      ansible.builtin.user:
        name: bob
        password: Test-Pass-1
      no_log: true
      changed_when: false
      when: not users_bob_home.stat.exists

    - name: Make bob an admin
      ansible.builtin.command: dseditgroup -o edit -a bob -t user admin
      changed_when: false
      when: not users_bob_home.stat.exists

    # carl's home is removed, so a marker records that the fixture already ran.
    - name: Look up carl marker
      ansible.builtin.stat:
        path: /var/tmp/finemas-users-absent-carl
      register: users_carl_marker

    - name: Create fixture account carl
      ansible.builtin.user:
        name: carl
        password: Test-Pass-1
      no_log: true
      changed_when: false
      when: not users_carl_marker.stat.exists

    - name: Write carl marker
      ansible.builtin.copy:
        content: ""
        dest: /var/tmp/finemas-users-absent-carl
        force: false
        mode: "0644"

    - name: Delete bob and keep the home
      ansible.builtin.include_role:
        name: finemas.macos.users
      vars:
        users_absent: [bob]
        users_ignore: "{{ users_recorded.stdout_lines }}"

    - name: Delete carl and remove the home
      ansible.builtin.include_role:
        name: finemas.macos.users
      vars:
        users_absent: [carl]
        users_absent_keep_home: false
        users_ignore: "{{ users_recorded.stdout_lines }}"
