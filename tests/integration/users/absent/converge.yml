---
- name: Converge users absent
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Record existing human accounts
      ansible.builtin.shell: |
        set -o pipefail
        dscl . -list /Users UniqueID | awk '$2 >= 500 && $1 !~ /^_/ {print $1}'
      args:
        executable: /bin/bash
      register: users_recorded
      changed_when: false

    # The kept home marks a finished run, so the second converge does not recreate bob.
    - name: Look up bob home
      ansible.builtin.stat:
        path: /Users/bob
      register: users_bob_home

    - name: Create fixture account bob
      ansible.builtin.user:
        name: bob
        password: Test-Pass-1
      no_log: true
      changed_when: false
      when: not users_bob_home.stat.exists

    - name: Make bob an admin
      ansible.builtin.command: dseditgroup -o edit -a bob -t user admin
      changed_when: false
      when: not users_bob_home.stat.exists

    - name: Look up fixture group
      ansible.builtin.command: dscl . -read /Groups/finemastest
      register: users_group
      changed_when: false
      failed_when: false

    - name: Create fixture group
      ansible.builtin.command: dscl . -create /Groups/finemastest PrimaryGroupID 4242
      changed_when: false
      when: users_group.rc != 0

    - name: Add bob to the fixture group by name only
      ansible.builtin.command: dscl . -append /Groups/finemastest GroupMembership bob
      changed_when: false
      when: not users_bob_home.stat.exists

    # Run before carl and dave exist: the drift check would reject them as undeclared.
    - name: Delete bob and keep the home
      ansible.builtin.include_role:
        name: finemas.macos.users
      vars:
        users_absent: [bob]
        users_ignore: "{{ users_recorded.stdout_lines }}"

    # carl's home is removed, so a marker records that the fixtures already ran.
    - name: Look up fixture marker
      ansible.builtin.stat:
        path: /var/tmp/finemas-users-absent-carl
      register: users_marker

    - name: Create fixture account carl
      ansible.builtin.user:
        name: carl
        password: Test-Pass-1
      no_log: true
      changed_when: false
      when: not users_marker.stat.exists

    - name: Create fixture account dave with a decoy home
      ansible.builtin.user:
        name: dave
        password: Test-Pass-1
        home: /Users/Shared/decoy-dave
      no_log: true
      changed_when: false
      when: not users_marker.stat.exists

    - name: Look up carl home
      ansible.builtin.stat:
        path: /Users/carl
      register: users_carl_home

    - name: Assert carl home exists before deletion
      ansible.builtin.assert:
        that: users_carl_home.stat.exists
        quiet: true
      when: not users_marker.stat.exists

    - name: Write fixture marker
      ansible.builtin.copy:
        content: ""
        dest: /var/tmp/finemas-users-absent-carl
        force: false
        mode: "0644"

    - name: Delete carl and dave, removing homes only where safe
      ansible.builtin.include_role:
        name: finemas.macos.users
      vars:
        users_absent: [carl, dave]
        users_absent_keep_home: false
        users_ignore: "{{ users_recorded.stdout_lines }}"
