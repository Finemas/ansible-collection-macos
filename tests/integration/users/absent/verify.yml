---
- name: Verify users absent
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Look up bob
      ansible.builtin.command: dscl . -read /Users/bob UniqueID
      register: bob
      changed_when: false
      failed_when: false

    - name: Look up bob home
      ansible.builtin.stat:
        path: /Users/bob
      register: bob_home

    - name: Search groups for bob
      ansible.builtin.command: dscl . -search /Groups GroupMembership bob
      register: bob_groups
      changed_when: false

    - name: Look up carl
      ansible.builtin.command: dscl . -read /Users/carl UniqueID
      register: carl
      changed_when: false
      failed_when: false

    - name: Look up carl home
      ansible.builtin.stat:
        path: /Users/carl
      register: carl_home

    - name: Look up dave
      ansible.builtin.command: dscl . -read /Users/dave UniqueID
      register: dave
      changed_when: false
      failed_when: false

    - name: Look up dave decoy home
      ansible.builtin.stat:
        path: /Users/Shared/decoy-dave
      register: dave_home

    - name: Assert bob is gone from every group with home kept, carl is fully gone and dave's decoy home survived
      ansible.builtin.assert:
        that:
          - bob.rc != 0
          - bob_home.stat.exists
          - bob_groups.stdout | trim == ''
          - carl.rc != 0
          - not carl_home.stat.exists
          - dave.rc != 0
          - dave_home.stat.exists
        quiet: true

    - name: Remove leftovers so the scenario can run again
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: [/Users/bob, /Users/dave, /Users/Shared/decoy-dave, /var/tmp/finemas-users-absent-carl]

    - name: Remove fixture group
      ansible.builtin.command: dscl . -delete /Groups/finemastest
      changed_when: true
