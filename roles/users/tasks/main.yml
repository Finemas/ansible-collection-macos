---
- name: Gather minimal facts
  ansible.builtin.setup:
    gather_subset: [min]

- name: Derive guard inputs
  ansible.builtin.set_fact:
    users_connection_user: "{{ ansible_user | default(ansible_facts['env']['SUDO_USER'] | default(ansible_facts['user_id'])) }}"
    users_nonadmin_names: >-
      {{ (users_accounts | rejectattr('admin', 'defined') | map(attribute='name') | list)
      + (users_accounts | selectattr('admin', 'defined') | rejectattr('admin') | map(attribute='name') | list) }}

- name: Derive guarded accounts
  ansible.builtin.set_fact:
    users_guarded: "{{ (users_guard_accounts + [users_connection_user]) | reject('equalto', '') | unique | list }}"

- name: Refuse to remove admin from the connection user
  ansible.builtin.fail:
    msg: Refusing to remove admin from the connection user
  when: users_connection_user in users_nonadmin_names

- name: Refuse to remove admin from a guarded account
  ansible.builtin.fail:
    msg: "Refusing to remove admin from guarded account {{ users_nonadmin_names | intersect(users_guarded) | first }}"
  when: users_nonadmin_names | intersect(users_guarded) | length > 0

- name: Refuse to delete the connection user
  ansible.builtin.fail:
    msg: Refusing to delete the connection user
  when: users_connection_user in users_absent

- name: Refuse to delete a guarded account
  ansible.builtin.fail:
    msg: "Refusing to delete guarded account {{ users_absent | intersect(users_guarded) | first }}"
  when: users_absent | intersect(users_guarded) | length > 0

- name: List human accounts
  ansible.builtin.shell: |
    set -o pipefail
    dscl . -list /Users UniqueID | awk '$2 >= {{ users_uid_min }} && $1 !~ /^_/ {print $1}'
  args:
    executable: /bin/bash
  register: users_human
  changed_when: false
  check_mode: false

- name: Refuse unknown accounts
  ansible.builtin.fail:
    msg: >-
      Unknown accounts (add to users_accounts, users_ignore or users_absent):
      {{ unknown | join(', ') }}
  vars:
    unknown: "{{ users_human.stdout_lines | difference((users_accounts | map(attribute='name') | list) + users_ignore + users_absent) | sort }}"
  when: unknown | length > 0

- name: Read auto-login user
  ansible.builtin.command: defaults read /Library/Preferences/com.apple.loginwindow autoLoginUser
  register: users_autologin_current
  changed_when: false
  failed_when: false
  check_mode: false
  when: users_autologin | length > 0

- name: Assert auto-login user
  ansible.builtin.assert:
    that: users_autologin_current.stdout == users_autologin
    fail_msg: "Auto-login user is '{{ users_autologin_current.stdout }}', expected '{{ users_autologin }}'; the role does not set it"
    quiet: true
  when: users_autologin | length > 0

- name: Look up declared accounts
  ansible.builtin.command: dscl . -read /Users/{{ item.name }} UniqueID
  loop: "{{ users_accounts }}"
  loop_control:
    label: "{{ item.name }}"
  register: users_lookup
  changed_when: false
  failed_when: false
  check_mode: false

- name: Collect missing accounts
  ansible.builtin.set_fact:
    users_missing: "{{ users_lookup.results | selectattr('rc', 'ne', 0) | map(attribute='item') | list }}"

# In check mode missing accounts are not created, so the steps below must skip them.
- name: Collect accounts that exist
  ansible.builtin.set_fact:
    users_live: >-
      {{ (users_accounts | rejectattr('name', 'in', users_missing | map(attribute='name') | list) | list)
      if ansible_check_mode else users_accounts }}

- name: Require a password for missing accounts
  ansible.builtin.fail:
    msg: "Account {{ users_missing | map(attribute='name') | first }} is missing; run push with users_initial_password"
  when: users_missing | length > 0 and users_initial_password is not defined

- name: Create missing accounts
  ansible.builtin.user:
    name: "{{ item.name }}"
    password: "{{ users_initial_password }}"
    hidden: "{{ item.hidden | default(false) | bool }}"
    shell: /bin/zsh
  loop: "{{ users_missing }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Check admin membership
  ansible.builtin.command: dseditgroup -o checkmember -m {{ item.name }} admin
  loop: "{{ users_live }}"
  loop_control:
    label: "{{ item.name }}"
  register: users_membership
  changed_when: false
  failed_when: users_membership.stdout is not match('^(yes|no) ')
  check_mode: false

- name: Reconcile admin membership
  ansible.builtin.command: dseditgroup -o edit {{ '-a' if item.item.admin | default(false) | bool else '-d' }} {{ item.item.name }} -t user admin
  loop: "{{ users_membership.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  changed_when: true
  when: (item.stdout is match('^yes ')) != (item.item.admin | default(false) | bool)

# Command tasks are skipped in check mode, so pending changes are reported by a harmless probe that always reports changed.
- name: Report pending admin changes (check mode)
  ansible.builtin.command: /usr/bin/true
  loop: "{{ users_membership.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  check_mode: false
  changed_when: true
  when: ansible_check_mode and (item.stdout is match('^yes ')) != (item.item.admin | default(false) | bool)

- name: Read hidden flags
  ansible.builtin.command: dscl . -read /Users/{{ item.name }} IsHidden
  loop: "{{ users_live }}"
  loop_control:
    label: "{{ item.name }}"
  register: users_hidden
  changed_when: false
  failed_when: false
  check_mode: false

- name: Reconcile hidden flags
  ansible.builtin.command: dscl . -create /Users/{{ item.item.name }} IsHidden {{ '1' if item.item.hidden | default(false) | bool else '0' }}
  loop: "{{ users_hidden.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  changed_when: true
  when: (item.rc == 0 and item.stdout.split()[-1] == '1') != (item.item.hidden | default(false) | bool)

- name: Report pending hidden changes (check mode)
  ansible.builtin.command: /usr/bin/true
  loop: "{{ users_hidden.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  check_mode: false
  changed_when: true
  when: ansible_check_mode and (item.rc == 0 and item.stdout.split()[-1] == '1') != (item.item.hidden | default(false) | bool)

- name: Look up home directories
  ansible.builtin.command: dscl . -read /Users/{{ item.name }} NFSHomeDirectory
  loop: "{{ users_live | selectattr('ssh_authorized_keys', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: users_homes
  changed_when: false
  check_mode: false

# Run as the account itself: a symlink planted in its home then grants nothing beyond its own rights.
- name: Create .ssh directories
  ansible.builtin.file:
    path: "{{ item.stdout.split(':', 1)[1] | trim }}/.ssh"
    state: directory
    mode: "0700"
  become: true
  become_user: "{{ item.item.name }}"
  loop: "{{ users_homes.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Write authorized_keys
  ansible.builtin.copy:
    content: "{{ item.item.ssh_authorized_keys | join('\n') }}{{ '\n' if item.item.ssh_authorized_keys | length > 0 else '' }}"
    dest: "{{ item.stdout.split(':', 1)[1] | trim }}/.ssh/authorized_keys"
    mode: "0600"
  become: true
  become_user: "{{ item.item.name }}"
  loop: "{{ users_homes.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Look up accounts to delete
  ansible.builtin.command: dscl . -read /Users/{{ item }} UniqueID
  loop: "{{ users_absent }}"
  register: users_doomed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Delete accounts
  ansible.builtin.command:
    argv: "{{ ['sysadminctl', '-deleteUser', item.item] + (['-keepHome'] if users_absent_keep_home else []) }}"
  loop: "{{ users_doomed.results }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true
  when: item.rc == 0

- name: Report pending deletions (check mode)
  ansible.builtin.command: /usr/bin/true
  loop: "{{ users_doomed.results }}"
  loop_control:
    label: "{{ item.item }}"
  check_mode: false
  changed_when: true
  when: ansible_check_mode and item.rc == 0

# sysadminctl exits 0 on many failures.
- name: Confirm deletion
  ansible.builtin.command: dscl . -read /Users/{{ item.item }} UniqueID
  loop: "{{ users_doomed.results }}"
  loop_control:
    label: "{{ item.item }}"
  register: users_after
  changed_when: false
  failed_when: false
  when: item.rc == 0 and not ansible_check_mode

- name: Fail when an account survived deletion
  ansible.builtin.fail:
    msg: "Failed to delete account {{ users_after.results | selectattr('rc', 'defined') | selectattr('rc', 'eq', 0) | map(attribute='item.item') | first }}"
  when: users_after.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'eq', 0) | list | length > 0
