---
# Without Command Line Tools /usr/bin/python3 is an installer stub, so this must stay Python-free (raw) until CLT exists.
- name: Check Command Line Tools
  ansible.builtin.raw: /usr/bin/xcode-select -p
  register: homebrew_clt
  changed_when: false
  failed_when: false

- name: Install Command Line Tools
  ansible.builtin.raw: |
    /bin/bash <<'EOS'
    set -eu -o pipefail
    marker=/tmp/.com.apple.dt.CommandLineTools.installondemand.in-progress
    trap 'rm -f "$marker"' EXIT
    touch "$marker"
    label="$(/usr/sbin/softwareupdate -l 2>&1 | sed -n 's/^ *\* Label: \(Command Line Tools.*\)$/\1/p' | tail -n 1)"
    if [ -z "$label" ]; then
      echo "No Command Line Tools label offered by softwareupdate" >&2
      exit 1
    fi
    /usr/sbin/softwareupdate -i "$label"
    EOS
  become: true
  changed_when: true
  when: homebrew_clt.rc != 0

- name: Gather minimal facts
  ansible.builtin.setup:
    gather_subset: [min]

- name: Require Apple Silicon
  ansible.builtin.assert:
    that: ansible_facts['architecture'] == 'arm64'
    fail_msg: Only Apple Silicon is supported
    quiet: true

- name: Refuse to run brew as root
  ansible.builtin.assert:
    that: homebrew_user != 'root'
    fail_msg: Homebrew cannot run as root; set homebrew_user
    quiet: true

# ansible_user_id is the effective user, so play-level become:true yields root and becomes homebrew_user here.
- name: Run brew as homebrew_user
  become: "{{ ansible_facts['user_id'] != homebrew_user }}"
  become_user: "{{ homebrew_user }}"
  block:
    - name: Check for brew
      ansible.builtin.stat:
        path: "{{ homebrew_prefix }}/bin/brew"
      register: homebrew_brew

    - name: Install Homebrew
      ansible.builtin.include_tasks: install.yml
      when: not homebrew_brew.stat.exists

    - name: Add taps
      community.general.homebrew_tap:
        name: "{{ homebrew_taps }}"
        path: "{{ homebrew_prefix }}/bin"
      when: homebrew_taps | length > 0

    - name: Install formulae
      community.general.homebrew:
        name: "{{ homebrew_formulae + (['mas'] if homebrew_mas_apps | length > 0 else []) }}"
        path: "{{ homebrew_prefix }}/bin"
      when: (homebrew_formulae | length > 0) or (homebrew_mas_apps | length > 0)

    - name: Install casks
      community.general.homebrew_cask:
        name: "{{ homebrew_casks }}"
        install_options: "{{ homebrew_cask_install_options }}"
        path: "{{ homebrew_prefix }}/bin"
      when: homebrew_casks | length > 0

    - name: Install Mac App Store apps
      community.general.mas:
        id: "{{ item.id }}"
        state: present
      environment:
        PATH: "{{ homebrew_prefix }}/bin:{{ ansible_facts['env']['PATH'] }}"
      loop: "{{ homebrew_mas_apps }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Upgrade formulae
      community.general.homebrew:
        update_homebrew: true
        upgrade_all: true
        path: "{{ homebrew_prefix }}/bin"
      when: homebrew_upgrade_all

    - name: Upgrade casks
      community.general.homebrew_cask:
        upgrade_all: true
        path: "{{ homebrew_prefix }}/bin"
      when: homebrew_upgrade_all
