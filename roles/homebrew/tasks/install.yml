---
# The installer refuses root and, in NONINTERACTIVE mode, only uses sudo via SUDO_ASKPASS.
- name: Install Homebrew
  block:
    - name: Create private temp dir
      ansible.builtin.tempfile:
        state: directory
        prefix: homebrew-install.
      register: homebrew_tmp

    - name: Write askpass helper
      ansible.builtin.copy:
        content: "#!/bin/sh\nprintf '%s\\n' {{ (ansible_become_password | default('')) | string | quote }}\n"
        dest: "{{ homebrew_tmp.path }}/askpass.sh"
        mode: "0700"
      no_log: true

    - name: Download installer
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh
        dest: "{{ homebrew_tmp.path }}/install.sh"
        mode: "0700"

    - name: Run installer
      ansible.builtin.command: /bin/bash {{ homebrew_tmp.path }}/install.sh
      environment:
        NONINTERACTIVE: "1"
        SUDO_ASKPASS: "{{ homebrew_tmp.path }}/askpass.sh"
      args:
        creates: "{{ homebrew_prefix }}/bin/brew"
  always:
    - name: Remove temp dir
      ansible.builtin.file:
        path: "{{ homebrew_tmp.path }}"
        state: absent
      when: homebrew_tmp.path is defined
